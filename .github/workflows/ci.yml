name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
        env:
          API_LICENSE_KEY: test-key

      # Surface failures on the run summary page so they're diagnosable
      # without downloading logs.
      - name: Publish failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### jest output (tail)'
            echo '```'
            tail -c 6000 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: curl -fsSX POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
